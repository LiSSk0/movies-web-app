<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>All movies - page #{{ page }}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: auto; padding: 20px; }
        .movie { border-bottom: 1px solid #ccc; padding: 10px 0; }
        .movie h3 { margin: 0; }
        .description { font-style: italic; color: #555; }
        .genre { color: #888; }
        .load-more { margin: 20px 0; }
        a.button, button.button {
            background-color: #4CAF50;
            color: white;
            padding: 4px 15px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        form.inline { display: inline; }
    </style>
</head>
<body>
    <h1>All movies — page #{{ page }}</h1>

    <!-- Search -->
    <form method="get" action="/movies">
        <input type="text" name="q" placeholder="Search by name..." value="{{ query }}">
        <button type="submit">Search</button>
    </form>

    <!-- Movies list -->
    {% for movie in movies %}
    <div class="movie">
        <h3>{{ movie.name }} ({{ movie.year if movie.year else 'N/A' }})</h3>
        <div class="genre">Genre: {{ movie.genre }}</div>
        <div class="description">{{ movie.description }}</div>

        <!-- Rate btn -->
        <form method="post" action="/add_rate" class="inline">
            <input type="hidden" name="email" value="lissk0@mail.ru">
            <input type="hidden" name="movie_id" value="{{ movie.id }}">
            <label>Rate (0–10):</label>
            <input type="number" name="rate" min="0" max="10" step="1" required>
            <button type="submit" class="button">Rate</button>
        </form>
    </div>
    {% endfor %}

    <!-- Btn "Upload more" -->
    <div class="load-more">
        {% if hasNext %}
            <form method="get" action="/movies">
                <input type="hidden" name="page" value="{{ page + 1 }}">
                {% if query %}
                    <input type="hidden" name="q" value="{{ query }}">
                {% endif %}
                <button type="submit" class="button">Upload more...</button>
            </form>
        {% else %}
            <p>No more movies.</p>
        {% endif %}
    </div>
</body>
</html>
